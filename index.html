<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狼人杀AI数据分析工具</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>狼人杀AI数据分析工具</h1>

        <div class="tab-bar">
            <button class="tab-btn active" data-tab="tab-game">对局</button>
            <button class="tab-btn" data-tab="tab-query-combined">数据查询</button>
            <button class="tab-btn" data-tab="tab-manage-combined">数据管理</button>
            <button class="tab-btn" data-tab="tab-config-combined">系统配置</button>
        </div>

        <!-- 对局 -->
        <div id="tab-game" class="tab-content active">
            <div class="section">
                <h2>1. 准备玩家</h2>
                <div class="form-group">
                    <label for="player-names-input">输入玩家 (用分号 ; 分隔):</label>
                    <textarea id="player-names-input" rows="3" placeholder="例如: 张三;李四;王五;小明"></textarea>
                    <button id="load-players-btn">加载/刷新玩家列表</button>
                </div>
                <div id="player-selection-area">
                    <p>请先加载玩家列表。</p>
                </div>
            </div>
            <div class="section">
                <h2>2. 开始新对局</h2>
                <div class="form-group">
                    <label for="player-count">上场玩家人数:</label>
                    <input type="number" id="player-count" value="12" min="1">
                    <button id="start-game-btn">开始新对局</button>
                </div>
            </div>
            <div class="section">
                <h2>当前对局 - 玩家身份设置</h2>
                <div id="player-setup">
                    <p>暂无对局进行中。</p>
                </div>
            </div>
            <div class="section">
                <h2>当前对局 - 行为记录</h2>
                <div class="form-group">
                    <input type="text" id="game-actor" placeholder="执行者ID">
                    <input type="text" id="game-target" placeholder="目标ID (可选)">
                    <select id="game-behavior"></select>
                    <button id="add-game-record-btn">添加行为</button>
                </div>
                <div id="game-flow">
                    <p>暂无行为记录。</p>
                </div>
            </div>
            <div class="section">
                <button id="end-game-btn" class="danger">结束并保存对局</button>
            </div>
        </div>

        <!-- 数据查询 -->
        <div id="tab-query-combined" class="tab-content">
            <div class="section">
                <h2>阵营概率预测</h2>
                <div class="form-group">
                    <input type="text" id="q-actor" placeholder="分析对象ID">
                    <input type="text" id="q-target" placeholder="相关玩家ID (可选)">
                </div>
                <div class="form-group">
                    <label>行为链:</label>
                    <select id="q-behavior"></select>
                    <button id="add-q-behavior-btn">添加行为</button>
                </div>
                <div id="q-chain-wrap" class="chain-wrap"></div>
                <button id="calc-camp-prob-btn">计算阵营概率</button>
                <div id="q-result" class="result-box"></div>
            </div>
            <div class="section">
                <h2>预言家概率预测</h2>
                <div class="form-group">
                    <input type="text" id="pro-actor" placeholder="分析对象ID">
                    <input type="text" id="pro-target" placeholder="相关玩家ID (可选)">
                </div>
                <div class="form-group">
                    <label>行为链:</label>
                    <select id="pro-behavior"></select>
                    <button id="add-pro-behavior-btn">添加行为</button>
                </div>
                <div id="pro-chain-wrap" class="chain-wrap"></div>
                <button id="calc-prophecy-prob-btn">计算预言家概率</button>
                <div id="pro-result" class="result-box"></div>
            </div>
        </div>

        <!-- 数据管理 -->
        <div id="tab-manage-combined" class="tab-content">
            <div class="section">
                <h2>数据备份与恢复</h2>
                <button id="export-data-btn">导出全部数据</button>
                <button id="import-data-btn">导入数据</button>
                <input type="file" id="import-file-input" accept=".json" style="display: none;">
                <button id="clear-data-btn" class="danger">清空所有数据</button>
            </div>
            <div class="section">
                <h2>历史对局记录</h2>
                <div id="game-records-list">
                    <p>暂无历史对局记录。</p>
                </div>
            </div>
        </div>

        <!-- 系统配置 -->
        <div id="tab-config-combined" class="tab-content">
            <div class="section">
                <h2>角色配置</h2>
                <div class="config-group">
                    <h3>好人阵营</h3>
                    <div id="good-roles" class="tag-container"></div>
                    <div class="form-group">
                        <input type="text" id="new-good-role" placeholder="新好人角色">
                        <button id="add-good-role-btn">添加</button>
                    </div>
                </div>
                <div class="config-group">
                    <h3>狼人阵营</h3>
                    <div id="evil-roles" class="tag-container"></div>
                    <div class="form-group">
                        <input type="text" id="new-evil-role" placeholder="新狼人角色">
                        <button id="add-evil-role-btn">添加</button>
                    </div>
                </div>
            </div>
            <div class="section">
                <h2>行为库配置</h2>
                <div id="behavior-lib-list" class="tag-container"></div>
                <div class="form-group">
                    <input type="text" id="new-behavior-lib" placeholder="新行为">
                    <button id="add-behavior-lib-btn">添加</button>
                </div>
            </div>
            <div class="section">
                <h2>玩家池配置</h2>
                <div id="player-pool-list" class="tag-container"></div>
                <div class="form-group">
                    <input type="text" id="new-player-pool" placeholder="新玩家名称">
                    <button id="add-player-pool-btn">添加</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
